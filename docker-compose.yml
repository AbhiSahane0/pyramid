services:
  postgres:
    image: postgres:16-alpine
    container_name: pyramid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pyramid
      POSTGRES_PASSWORD: pyramid
      POSTGRES_DB: pyramid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyramid -d pyramid"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
